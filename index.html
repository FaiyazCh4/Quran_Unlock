    <script>
      // Suppress Vite HMR WebSocket connection errors in iFrame sandbox environment
      window.addEventListener('unhandledrejection', function (e) {
        if (
          e.reason &&
          (String(e.reason).includes('WebSocket') ||
            (e.reason.message && e.reason.message.includes('WebSocket')) ||
            (e.reason.stack && e.reason.stack.includes('@vite/client')))
        ) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        if (e.message && e.message.includes('WebSocket')) {
          e.preventDefault();
        }
      });
    </script>
